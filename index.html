<style>
:root{
  --bg:#EFF1EE;
  --surface:#FFFFFF;
  --surface2:#E6E9E5;
  --ink:#171A19;
  --muted:#5C6661;
  --line:rgba(23,26,25,.14);
  --deep:#0F1A17;
  --deep2:#16241F;
  --paper:#EFF1EE;
  --violet:#A9781E;
  --violet-soft:rgba(169,120,30,.11);
  --teal:#0F2A4D;
  --display:"Spectral",Georgia,serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412;--surface:#171F1C;--surface2:#1D2723;
    --ink:#E7EBE8;--muted:#98A29D;--line:rgba(231,235,232,.16);
    --violet:#D9A94E;--violet-soft:rgba(217,169,78,.14);--teal:#3E6CA8;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412;--surface:#171F1C;--surface2:#1D2723;
  --ink:#E7EBE8;--muted:#98A29D;--line:rgba(231,235,232,.16);
  --violet:#D9A94E;--violet-soft:rgba(217,169,78,.14);--teal:#3E6CA8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(74px + env(safe-area-inset-top,0px))}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}html{scroll-behavior:auto}}

.wrap{width:min(1140px,92vw);margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em}

/* ---------- nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:74px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.sigil{width:38px;height:38px;flex-shrink:0;object-fit:contain}
.brand-txt strong{display:block;font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.brand-txt span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:3px}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{font-size:14.5px;color:var(--muted);text-decoration:none;padding:4px 0;border-bottom:1.5px solid transparent;transition:color .18s,border-color .18s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.on{color:var(--ink);border-color:var(--violet)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:3px;color:var(--ink);font-family:var(--body);font-size:14px;padding:9px 14px;cursor:pointer}
.drawer{display:none;border-top:1px solid var(--line);padding:10px 0 18px}
.drawer a{display:block;padding:11px 0;text-decoration:none;font-size:16px;border-bottom:1px solid var(--line);color:var(--ink)}
@media(max-width:940px){.nav-links{display:none}.burger{display:block}.drawer.open{display:block}}

/* ---------- hero ---------- */
.hero{background:var(--deep);color:#E7EBE8;position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,60px);align-items:center;padding:clamp(52px,8vw,96px) 0}
@media(max-width:900px){.hero-in{grid-template-columns:1fr;padding-bottom:40px}}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.08;margin:0 0 20px;max-width:17ch;color:#F2F5F3}
.hero p{color:#A9B5B0;font-size:18px;max-width:50ch;margin:0 0 30px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{font-family:var(--body);font-size:15px;font-weight:500;border-radius:3px;padding:13px 22px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-block;transition:background .18s,color .18s,border-color .18s,transform .18s,box-shadow .18s}
.btn-solid{background:#A9781E;color:#fff;border-color:#A9781E;box-shadow:0 8px 20px -8px rgba(169,120,30,.6)}
.btn-solid:hover{background:#BE8B29;transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(169,120,30,.7)}
.btn-line{background:transparent;color:#E7EBE8;border-color:rgba(231,235,232,.3)}
.btn-line:hover{background:rgba(231,235,232,.08);transform:translateY(-1px)}
.print-holder{position:relative;display:grid;place-items:center}
.print{width:min(100%,360px);height:auto;overflow:visible}
.ridge{fill:none;stroke:#8B74F0;stroke-width:2.2;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;
  animation:develop 1.5s ease forwards;}
@keyframes develop{to{stroke-dashoffset:0}}
.scan{animation:sweep 2.6s cubic-bezier(.45,0,.4,1) .5s 1 both}
@keyframes sweep{0%{transform:translateY(-30px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(410px);opacity:0}}
.print-cap{margin-top:14px;font-size:13px;color:#8A9792;text-align:center}

/* ---------- strip ---------- */
.strip{background:var(--deep2);color:#D6DEDA;border-top:1px solid rgba(231,235,232,.1)}
.strip-in{display:grid;grid-template-columns:repeat(4,1fr)}
.strip-c{padding:24px 22px;border-right:1px solid rgba(231,235,232,.1)}
.strip-c:last-child{border-right:0}
.strip-n{font-family:var(--display);font-size:28px;color:#D9A94E;line-height:1}
.strip-l{font-size:13.5px;color:#93A09B;margin-top:5px}
@media(max-width:720px){.strip-in{grid-template-columns:1fr 1fr}.strip-c:nth-child(2n){border-right:0}.strip-c:nth-child(-n+2){border-bottom:1px solid rgba(231,235,232,.1)}}

/* ---------- sections ---------- */
.section{padding:clamp(58px,8vw,100px) 0}
.alt{background:var(--surface2)}
.head{max-width:54ch;margin-bottom:clamp(28px,4vw,46px)}
.head h2{font-size:clamp(26px,3.5vw,36px);margin:0 0 12px;line-height:1.16}
.head p{color:var(--muted);margin:0;font-size:16.5px}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:start}
@media(max-width:860px){.about{grid-template-columns:1fr}}
.about p{margin:0 0 16px;color:var(--ink)}
.about p.lead{font-family:var(--display);font-size:21px;line-height:1.5}
.pillars{border-top:1px solid var(--line)}
.pillar{padding:18px 0;border-bottom:1px solid var(--line)}
.pillar h3{margin:0 0 4px;font-size:18px}
.pillar p{margin:0;font-size:15px;color:var(--muted)}
.creds{margin-top:26px;font-size:14.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:100px;padding:5px 13px}

/* services */
.svcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 24px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(15,26,23,.04);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.svc:hover{transform:translateY(-3px);box-shadow:0 14px 28px -12px rgba(15,26,23,.2);border-color:var(--violet)}
.svc-i{width:30px;height:30px;color:var(--violet);margin-bottom:16px}
.svc h3{margin:0 0 8px;font-size:20px}
.svc p{margin:0 0 14px;font-size:15.5px;color:var(--muted)}
.svc ul{margin:auto 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.svc li{padding:3px 0}
.svc li::before{content:"";display:inline-block;width:5px;height:5px;background:var(--teal);margin-right:9px;vertical-align:middle;border-radius:1px}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(15,26,23,.04);transition:transform .2s ease,box-shadow .2s ease}
.member:hover{transform:translateY(-3px);box-shadow:0 14px 28px -12px rgba(15,26,23,.22)}
.member-photo{aspect-ratio:4/5;overflow:hidden;background:var(--surface2)}
.member-photo img{width:100%;height:100%;object-fit:cover;display:block}
.member-info{padding:22px 24px 26px}
.member-info h3{margin:0 0 4px;font-size:20px}
.member-role{display:inline-block;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--violet);text-transform:uppercase;margin-bottom:12px}
.member-info p{margin:0;font-size:15px;color:var(--muted);line-height:1.55}

/* research */
.research{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(28px,5vw,60px)}
@media(max-width:860px){.research{grid-template-columns:1fr}}
.areas{margin:0;padding:0;list-style:none}
.area{border-top:1px solid var(--line);padding:16px 0}
.area:last-child{border-bottom:1px solid var(--line)}
.area h3{margin:0 0 4px;font-size:18px}
.area p{margin:0;font-size:15px;color:var(--muted)}
.pubs{margin:0;padding:0;list-style:none}
.pub{border-left:2px solid var(--violet);padding:4px 0 4px 18px;margin-bottom:22px}
.pub-t{font-family:var(--display);font-size:18px;line-height:1.35;display:block;margin-bottom:5px}
.pub-m{font-size:14px;color:var(--muted)}

/* case studies */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.case{
  text-align:left;font-family:var(--body);cursor:pointer;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);
  border-radius:4px;padding:22px;min-height:180px;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(15,26,23,.04);
  transition:border-color .18s,transform .2s ease,box-shadow .2s ease;
}
.case:hover{border-color:var(--violet);border-left-color:var(--violet);transform:translateY(-3px);box-shadow:0 14px 28px -12px rgba(15,26,23,.2)}
.case-no{font-size:12.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:10px}
.case h3{margin:0 0 10px;font-size:19px;line-height:1.28}
.case p{margin:0;font-size:15px;color:var(--muted)}
.case-f{margin-top:auto;padding-top:14px;font-size:13.5px;color:var(--violet)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-top:16px;padding:clamp(24px,4vw,38px);animation:rise .26s ease both}
@keyframes rise{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.detail-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.detail h3{font-size:clamp(22px,3vw,28px);margin:6px 0 0;max-width:24ch}
.close{background:none;border:1px solid var(--line);border-radius:3px;color:var(--ink);font-family:var(--body);font-size:13.5px;padding:7px 13px;cursor:pointer}
.close:hover{background:var(--surface2)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(22px,4vw,44px);margin-top:22px}
@media(max-width:780px){.detail-grid{grid-template-columns:1fr}}
.detail-grid p{margin:0 0 14px}
.facts{margin:0;font-size:14.5px}
.facts dt{color:var(--muted);margin-top:14px}
.facts dt:first-child{margin-top:0}
.facts dd{margin:2px 0 0;font-weight:500}
.finding{margin-top:16px;background:var(--violet-soft);border-left:3px solid var(--violet);padding:14px 16px;font-size:15px}

/* footer */
.foot{background:var(--deep);color:#93A09B;padding:40px 0;font-size:14.5px}
.foot-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}
.foot h4{font-family:var(--display);color:#E7EBE8;font-size:16px;margin:0 0 10px;font-weight:600}
.foot a{display:block;text-decoration:none;padding:3px 0;color:#93A09B}
.foot a:hover{color:#E7EBE8}
.foot-base{border-top:1px solid rgba(231,235,232,.12);margin-top:30px;padding-top:20px;font-size:13.5px}
</style>
</head>

function Fingerprint() {
  const ridges = Array.from({ length: 13 }, (_, i) => ({
    rx: 12 + i * 10.5,
    ry: 16 + i * 13.5,
    delay: 0.25 + i * 0.09,
    op: 1 - i * 0.045
  }));
  return (
    <div className="print-holder">
      <svg className="print" viewBox="0 0 400 420" role="img" aria-label="A latent fingerprint developing">
        <defs>
          <clipPath id="tip">
            <path d="M200,28 C264,28 292,96 292,182 C292,308 254,392 200,392 C146,392 108,308 108,182 C108,96 136,28 200,28 Z" />
          </clipPath>
          <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#43C4B2" stopOpacity="0" />
            <stop offset="50%" stopColor="#43C4B2" stopOpacity=".85" />
            <stop offset="100%" stopColor="#43C4B2" stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d="M200,28 C264,28 292,96 292,182 C292,308 254,392 200,392 C146,392 108,308 108,182 C108,96 136,28 200,28 Z"
          fill="rgba(110,86,220,.06)" stroke="rgba(231,235,232,.18)" strokeWidth="1.5" />
        <g clipPath="url(#tip)">
          {ridges.map((r, i) => (
            <ellipse key={i} className="ridge" cx="200" cy="196" rx={r.rx} ry={r.ry}
              strokeOpacity={r.op} pathLength="1"
              style={{ animationDelay: r.delay + "s" }} />
          ))}
          <g className="scan">
            <rect x="100" y="0" width="200" height="3" fill="url(#scanG)" />
            <rect x="100" y="3" width="200" height="26" fill="url(#scanG)" opacity=".16" />
          </g>
        </g>
      </svg>
      <p className="print-cap">Latent print, cyanoacrylate developed — FIRA practical laboratory</p>
    </div>
  );
}

function Hero() {
  return (
    <header className="hero" id="home">
      <div className="wrap hero-in">
        <div>
          <h1>Advancing forensic science through research &amp; innovation.</h1>
          <p>FIRA is a forensic investigation and research academy, founded in 2026 in Karur, Tamil Nadu, to build a platform where students, researchers, academics and professionals learn, collaborate and practise with evidence at the centre. Evidence, science, justice.</p>
          <div className="hero-actions">
            <a href="#services" className="btn btn-solid">Explore our services</a>
            <a href="#about" className="btn btn-line">About FIRA</a>
          </div>
        </div>
        <Fingerprint />
      </div>
    </header>
  );
}

function Strip() {
  const s = [["2026","Founded"],["5","Focus pillars"],["Karur","Home base, Tamil Nadu"],["MSME","Udyam-registered"]];
  return (
    <section className="strip">
      <div className="wrap strip-in">
        {s.map(([n,l]) => (
          <div className="strip-c" key={l}>
            <div className="strip-n">{n}</div>
            <div className="strip-l">{l}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function About() {
  return (
    <section className="section" id="about">
      <div className="wrap">
        <div className="head">
          <h2>About the academy</h2>
          <p>A working laboratory that teaches, rather than a college that talks about laboratories.</p>
        </div>
        <div className="about">
          <div>
            <p className="lead">FIRA was founded in 2026 by Mappillai Meeran P. to give forensic science in India a single home for research, teaching and practice.</p>
            <p>We are a private academy built around five commitments: research, education, training, investigation-related knowledge, and innovation. The idea is straightforward — students, researchers, academics and working professionals need a platform to build scientific skill, examine emerging areas of the field, and hold to evidence-based, ethical practice, rather than picking these up piecemeal.</p>
            <p>We are early in that work. FIRA is a registered micro enterprise under India's Udyam framework, based in Karur, Tamil Nadu, and is building out its programmes, research lines and partnerships from the ground up. What follows on this page reflects that direction of travel, not a finished institution.</p>
            <div className="creds">
              <span className="chip">Udyam-registered micro enterprise</span>
              <span className="chip">Founded 2026, Karur, Tamil Nadu</span>
              <span className="chip">Founder & Chief Director: Mappillai Meeran P.</span>
            </div>
          </div>
          <div className="pillars">
            <div className="pillar">
              <h3>Research</h3>
              <p>Building lines of enquiry chosen for gaps the existing literature does not cover.</p>
            </div>
            <div className="pillar">
              <h3>Education</h3>
              <p>A platform for students and academics to develop forensic scientific skill from first principles.</p>
            </div>
            <div className="pillar">
              <h3>Training</h3>
              <p>Practical, professional development for people already working in investigation and allied fields.</p>
            </div>
            <div className="pillar">
              <h3>Investigation &amp; innovation</h3>
              <p>Applying scientific method and new technology to how evidence is understood and used.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function Icon({ i }) {
  const paths = [
    "M6 3h12v18H6zM9 8h6M9 12h6M9 16h3",
    "M12 3c4 0 6 4 6 9s-2 9-6 9-6-4-6-9 2-9 6-9zM12 8c1.5 0 2.5 2 2.5 4.5S13.5 17 12 17",
    "M4 5h16v11H4zM9 20h6M12 16v4",
    "M3 20l7-7 4 4 7-9M3 20h18",
    "M4 20V9M10 20V4M16 20v-7M22 20H2",
    "M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z"
  ];
  return (
    <svg className="svc-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"
      strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d={paths[i % paths.length]} />
    </svg>
  );
}

function Services() {
  return (
    <section className="section alt" id="services">
      <div className="wrap">
        <div className="head">
          <h2>Laboratory services</h2>
          <p>Six examination disciplines, each ending in a report written for someone whose job is to challenge it.</p>
        </div>
        <div className="svcs">
          {SERVICES.map((s, i) => (
            <div className="svc" key={s.t}>
              <Icon i={i} />
              <h3>{s.t}</h3>
              <p>{s.d}</p>
              <ul>{s.l.map(x => <li key={x}>{x}</li>)}</ul>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Research() {
  return (
    <section className="section alt" id="research">
      <div className="wrap">
        <div className="head">
          <h2>Research</h2>
          <p>We work on problems the published literature does not answer for the conditions we examine in — tropical climate, vernacular scripts, and exhibits that arrive in poor condition.</p>
        </div>
        <div className="research">
          <div>
            <ul className="areas">
              {RESEARCH_AREAS.map(a => (
                <li className="area" key={a.t}>
                  <h3>{a.t}</h3>
                  <p>{a.d}</p>
                </li>
              ))}
            </ul>
          </div>
          <div>
            <ul className="pubs">
              {PUBS.map(p => (
                <li className="pub" key={p.t}>
                  <span className="pub-t">{p.t}</span>
                  <span className="pub-m">{p.m}</span>
                </li>
              ))}
            </ul>
            <p style={{fontSize:"15px",color:"var(--muted)",marginTop:"4px"}}>
              PG diploma students join an active research line in their final term. Reprints are available on request to academic and agency researchers.
            </p>
          </div>
        </div>
      </div>
    </section>
  );
}

function Cases() {
  const [active, setActive] = useState(null);
  return (
    <section className="section" id="cases">
      <div className="wrap">
        <div className="head">
          <h2>How we approach a case</h2>
          <p>FIRA is newly founded, so these are illustrative scenarios showing our method rather than a record of closed matters. Open one to see how we'd work it.</p>
        </div>
        <div className="cases">
          {CASES.map((c, i) => (
            <button className="case" key={c.no} onClick={() => setActive(i)}>
              <span className="case-no">{c.no} · {c.tag}</span>
              <h3>{c.hook}</h3>
              <p>{c.brief.slice(0, 96)}…</p>
              <span className="case-f">Read the file</span>
            </button>
          ))}
        </div>
        {active !== null && (
          <div className="detail">
            <div className="detail-top">
              <div>
                <span className="case-no">{CASES[active].no} · {CASES[active].tag}</span>
                <h3>{CASES[active].hook}</h3>
              </div>
              <button className="close" onClick={() => setActive(null)}>Close</button>
            </div>
            <div className="detail-grid">
              <div>
                <p>{CASES[active].brief}</p>
                <p>{CASES[active].detail}</p>
                <div className="finding"><strong>Finding.</strong> {CASES[active].finding}</div>
              </div>
              <dl className="facts">
                {CASES[active].facts.map(([k,v]) => (
                  <React.Fragment key={k}>
                    <dt>{k}</dt><dd>{v}</dd>
                  </React.Fragment>
                ))}
              </dl>
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

function Team() {

function App() {
  const [active, setActive] = useState("home");
  useEffect(() => {
    const obs = new IntersectionObserver(
      entries => {
        entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
      },
      { rootMargin: "-45% 0px -50% 0px" }
    );
    NAV.forEach(([id]) => {
      const el = document.getElementById(id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  return (
    <React.Fragment>
      <Nav active={active} />
      <Hero />
      <Strip />
      <About />
      <Services />
      <Research />
      <Cases />
      <Team />
      <Foot />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
